<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Drop Shadow Filter for Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .animated-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .particle1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .particle3 { animation: floatParticle 4.5s ease-in-out infinite 0.5s; }

    .moving-line {
      stroke-dasharray: 8 8;
      animation: dashCycle 2s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGradient)" rx="16"/>
  <rect width="1200" height="320" fill="url(#gridPattern)" rx="16"/>

  <!-- Dynamic Glowing Background Blobs (Behind Content) -->
  <circle cx="200" cy="160" r="140" fill="url(#glowGradient)" class="animated-glow"/>
  <circle cx="1000" cy="160" r="160" fill="url(#glowGradient)" class="animated-glow"/>

  <!-- Dynamic Connecting Flow Lines (Background Layer) -->
  <path d="M 100 240 Q 300 280 600 240 T 1100 240" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3" class="moving-line"/>
  <path d="M 100 80 Q 500 20 900 60 T 1100 80" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.25" class="moving-line"/>

  <!-- Dynamic Background Particles/Nodes (Behind Text) -->
  <g opacity="0.5">
    <circle cx="150" cy="90" r="4" fill="#818cf8" class="particle1"/>
    <circle cx="280" cy="70" r="6" fill="#c084fc" class="particle2"/>
    <circle cx="1050" cy="100" r="5" fill="#38bdf8" class="particle3"/>
    <circle cx="920" cy="230" r="4" fill="#818cf8" class="particle1"/>
    <circle cx="110" cy="220" r="5" fill="#c084fc" class="particle2"/>
  </g>

  <!-- Decorative Accent Header Line -->
  <rect x="80" y="45" width="1040" height="4" rx="2" fill="url(#accentGradient)"/>

  <!-- Main Foreground Content (Never Blocked) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Badge -->
    <g transform="translate(80, 68)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="16" r="6" fill="#10b981"/>
      <text x="32" y="21" class="badge-text">🔄 HUMAN-IN-THE-LOOP ML PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="148" class="title">Awesome Human-In-The-Loop ML</text>
    
    <!-- Subtitle -->
    <text x="80" y="188" class="subtitle">Curated Directory of Active Learning, RLHF &amp; Data Annotation Systems</text>

    <!-- Category Pill Badges (Foreground Footer) -->
    <g transform="translate(80, 220)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
        <text x="90" y="23" text-anchor="middle" class="badge-text" fill="#a5b4fc">🤖 Active Learning</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="90" y="23" text-anchor="middle" class="badge-text" fill="#e9d5ff">🎯 RLHF Pipelines</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(390, 0)">
        <rect width="200" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="100" y="23" text-anchor="middle" class="badge-text" fill="#bae6fd">🏷️ Data Annotation</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(605, 0)">
        <rect width="220" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="110" y="23" text-anchor="middle" class="badge-text" fill="#a7f3d0">🛡️ Model Evaluation</text>
      </g>
    </g>
  </g>
</svg>
